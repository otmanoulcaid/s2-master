<!DOCTYPE html>
	<html xmlns:th="www.thymeleaf.org">
	<head>
	<meta charset="UTF-8">
	<title>Insert title here</title>
	<!-- Url expression pour la resolution dynamique de l'url -->
	<link rel="stylesheet"  th:href="@{/css/styles.css}"/>
</head>
<body>
	<h1 th:text="${title}"></h1>

	<table class="data-table">
		<tr>
			<th>Id</th>
			<th>Nom</th>
			<th>Annee</th>
		</tr>
		
		<tr th:each="a : ${authors}">
			<td th:text="${a.id}"></td>
			<td th:text="${a.name}"></td>
			<td th:text="${a.yearBorn}"></td>
		</tr>
	</table>
</body>
</html>
